name: Update Techmeme One Click RSS

on:
  workflow_dispatch:
  push:
    paths:
      - "techmeme-oneclick/generate.py"
      - ".github/workflows/techmeme-oneclick.yml"
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: techmeme-oneclick
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate direct-link RSS
        run: python techmeme-oneclick/generate.py
      - name: Commit feed if changed
        run: |
          if git diff --quiet -- techmeme-oneclick/feed.xml; then
            echo "No feed changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add techmeme-oneclick/feed.xml
          git commit -m "Update Techmeme One Click RSS"
          git push
